<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="barraNavegacao">

        <h1>Mercadinho</h1>

        <div class="botoes">
            <a class="link" href="index.html">Home</a>
            <a class="link ativo" href="catalogo.html">Catálogo</a>
            <a class="link" href="sobre.html">Sobre</a>
            <a class="link" href="carrinho.html">Carrinho</a>
            <a class="btnEntrar" href="login.html">Entrar</a>
        </div>
    </header>

    <main>
        <section class="tituloPagina">Catálogo</section>

        <section class="filtrosCatalogo">
            
            <input type="text" id="filtroNome" placeholder="Filtrar por nome">
            
           <div class="botoesCategoria">
                <button type="button" class="btnFiltro ativo" data-categoria="todos">Todos</button>
                <button type="button" class="btnFiltro" data-categoria="Alimentos">Alimentos</button>
                <button type="button" class="btnFiltro" data-categoria="Bebidas">Bebidas</button>
                <button type="button" class="btnFiltro" data-categoria="Casa">Casa</button>
                <button type="button" class="btnFiltro" data-categoria="Roupas">Roupas</button>
            </div>
             
        </section>

            

    </main>

    <footer class="rodape">
        <p>Todos os direitos reservados &copy; 2026 mercadinho LTDA.</p>

        <div class="redesSociais">
            <p>Nos siga em nossas redes sociais</p>
            <div>
                <img src="imagens/instagram.png" alt="Instagram">
                <img src="imagens/linkedin.png" alt="LinkedIn">
                <img src="imagens/facebook.png" alt="Facebook">
            </div>
        </div>
    </footer>

    <script src="scripts/catalogo.js"></script>
</body>
</html>
