<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="barraNavegacao">

        <h1>Mercadinho</h1>

        <div class="botoes">
            <a class="link" href="index.html">Home</a>
            <a class="link" href="catalogo.html">Catálogo</a>
            <a class="link" href="sobre.html">Sobre</a>
            <a class="link" href="carrinho.html">Carrinho</a>
            <a class="btnEntrar" href="login.html">Entrar</a>
        </div>
    </header>

    <main>
        <section class="tituloPagina">
            <h1>Cadastro</h1>
        </section>

        <section id="cadastro">
            <form id="formCadastro">
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

                <button type="submit">Cadastrar</button>

                <p class="mensagem" id="msgCadastro" role="alert" hidden></p>
            </form>
        </section>
    </main>

    <footer class="rodape">
        
        <div>
            <p>Todos os direitos reservados &copy; 2026 mercadinho LTDA.</p>
            <a href="ajuda.html">Central de Ajuda</a>
        </div>

        <div class="redesSociais">
            <p>Nos siga em nossas redes sociais</p>
            <div>
                <img src="imagens/instagram.png" alt="Instagram">
                <img src="imagens/linkedin.png" alt="LinkedIn">
                <img src="imagens/facebook.png" alt="Facebook">
            </div>
        </div>
    </footer>

    <script src="scripts/api.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/cadastro.js"></script>
</body>
</html>
