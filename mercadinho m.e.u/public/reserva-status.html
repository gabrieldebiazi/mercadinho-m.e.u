<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="barraNavegacao">
        <h1>Mercadinho</h1>

        <div class="botoes">
            <a class="link" href="index.html">Home</a>
            <a class="link" href="catalogo.html">Catálogo</a>
            <a class="link" href="sobre.html">Sobre</a>
            <a class="link" href="carrinho.html">Carrinho</a>
            <a class="btnEntrar" href="login.html">Entrar</a>
        </div>
    </header>

    <main>
        <section class="tituloPagina">Acompanhar Pedido</section>

        <p class="mensagem" id="pedidoMsg" role="status" hidden></p>

        <section class="resumoPedido pedidoDetalhe" id="pedidoConteudo" hidden>
            <div>
                <h2 id="pedidoCodigo"></h2>
                <span id="pedidoStatus"></span>
            </div>

            <p id="pedidoData"></p>
            <p id="pedidoTipo"></p>
            <p id="pedidoEndereco" hidden></p>
            <p id="pedidoPagamento"></p>

            <ul id="pedidoItens"></ul>

            <div>
                <p>Subtotal</p>
                <p id="pedidoSubtotal"></p>
            </div>

            <div>
                <p>Entrega</p>
                <p id="pedidoEntrega"></p>
            </div>

            <div>
                <h2>Total</h2>
                <h2 id="pedidoTotal"></h2>
            </div>

            <div class="acoes">
                <a class="btn" href="catalogo.html">Continuar comprando</a>
            </div>
        </section>
    </main>

    <footer class="rodape">

        <div>
            <p>Todos os direitos reservados &copy; 2026 mercadinho LTDA.</p>
            <a href="ajuda.html">Central de Ajuda</a>
        </div>

        <div class="redesSociais">
            <p>Nos siga em nossas redes sociais</p>
            <div>
                <img src="imagens/instagram.png" alt="Instagram">
                <img src="imagens/linkedin.png" alt="LinkedIn">
                <img src="imagens/facebook.png" alt="Facebook">
            </div>
        </div>
    </footer>

    <script src="scripts/api.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/reserva-status.js"></script>
</body>

</html>
