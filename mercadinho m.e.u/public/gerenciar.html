<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="barraNavegacao">
        <h1>Mercadinho</h1>

        <div class="botoes">
            <a class="link" href="index.html">Home</a>
            <a class="link" href="catalogo.html">Catálogo</a>
            <a class="link" href="gerente.html">Painel</a>
            <a class="link ativo" href="gerenciar.html">Gerenciar</a>
            <a class="link" href="funcionario.html">Pedidos</a>
            <a class="btnSair" href="#">Sair</a>
        </div>
    </header>

    <main>
        <section class="tituloPagina">Gerenciar Produtos e Estoque</section>

        <p class="mensagem" id="msgAcesso" role="alert" hidden></p>

        <div class="secao" id="painelGerenciar" hidden>
            <section class="card">
                <h2 id="tituloForm">Cadastrar novo produto</h2>

                <form class="formProduto" id="formProduto">
                    <input type="hidden" id="produtoId">

                    <div>
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div>
                        <label for="categoria">Categoria</label>
                        <select id="categoria" required>
                            <option value="Alimentos">Alimentos</option>
                            <option value="Bebidas">Bebidas</option>
                            <option value="Casa">Casa</option>
                            <option value="Roupas">Roupas</option>
                        </select>
                    </div>

                    <div>
                        <label for="preco">Preço (R$)</label>
                        <input type="number" id="preco" min="0" step="0.01" required>
                    </div>

                    <div>
                        <label for="estoque">Estoque</label>
                        <input type="number" id="estoque" min="0" step="1" required>
                    </div>

                    <div class="campoLargo">
                        <label for="imagemArquivo">Imagem do produto (JPG, PNG ou WebP, até 2 MB)</label>
                        <input type="file" id="imagemArquivo" accept="image/jpeg,image/png,image/webp">

                        <label for="imagemUrl">Ou o endereço de uma imagem (opcional)</label>
                        <input type="text" id="imagemUrl" placeholder="https://... ou imagens/produtos/arroz.jpg">

                        <img class="previaImagem" id="previaImagem" alt="Prévia da imagem" hidden>
                    </div>

                    <div class="campoLargo">
                        <label for="descricao">Descrição (opcional)</label>
                        <textarea id="descricao" rows="3"></textarea>
                    </div>

                    <p class="mensagem campoLargo" id="msgForm" role="status" hidden></p>

                    <div class="acoes campoLargo">
                        <button type="submit" id="btnSalvar">Cadastrar produto</button>
                        <button type="button" class="btnSecundario" id="btnCancelar" hidden>Cancelar edição</button>
                    </div>
                </form>
            </section>

            <section class="card">
                <h2>Produtos cadastrados</h2>

                <div class="tabelaWrap">
                    <table class="tabelaProdutos">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Categoria</th>
                                <th>Preço</th>
                                <th>Estoque</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <footer class="rodape">
        <p>Todos os direitos reservados &copy; 2026 mercadinho LTDA.</p>

        <div class="redesSociais">
            <p>Nos siga em nossas redes sociais</p>
            <div>
                <img src="imagens/instagram.png" alt="Instagram">
                <img src="imagens/linkedin.png" alt="LinkedIn">
                <img src="imagens/facebook.png" alt="Facebook">
            </div>
        </div>
    </footer>

    <script src="scripts/api.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/gerenciar.js"></script>
</body>
</html>
