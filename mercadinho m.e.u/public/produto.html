<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="barraNavegacao">
        <h1>Mercadinho</h1>

        <div class="botoes">
            <a class="link" href="index.html">Home</a>
            <a class="link" href="catalogo.html">Catálogo</a>
            <a class="link" href="sobre.html">Sobre</a>
            <a class="link" href="carrinho.html">Carrinho</a>
            <a class="btnEntrar" href="login.html">Entrar</a>
        </div>
    </header>

    <main>
        <section class="tituloPagina">Detalhes do Produto</section>

        <p class="mensagem" id="produtoMsg" role="status" hidden></p>

        <section class="card produtoDetalhe" id="produtoConteudo" hidden>
            <img id="produtoImagem" alt="" hidden>
            <div class="semImagem" id="produtoSemImagem" hidden>Sem imagem</div>

            <div>
                <p class="categoriaProduto" id="produtoCategoria"></p>
                <h1 id="produtoNome"></h1>
                <p class="preco" id="produtoPreco"></p>
                <p id="produtoDescricao"></p>
                <p id="produtoEstoque"></p>

                <div>
                    <label for="produtoQtd">Quantidade</label>
                    <input type="number" id="produtoQtd" value="1" min="1">
                </div>

                <div class="acoes">
                    <button type="button" id="btnAdicionar">Adicionar ao Carrinho</button>
                    <a class="btnSecundario" href="catalogo.html">Voltar ao Catálogo</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="rodape">

        <div>
            <p>Todos os direitos reservados &copy; 2026 mercadinho LTDA.</p>
            <a href="ajuda.html">Central de Ajuda</a>
        </div>

        <div class="redesSociais">
            <p>Nos siga em nossas redes sociais</p>
            <div>
                <img src="imagens/instagram.png" alt="Instagram">
                <img src="imagens/linkedin.png" alt="LinkedIn">
                <img src="imagens/facebook.png" alt="Facebook">
            </div>
        </div>
    </footer>

    <script src="scripts/api.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/produto.js"></script>
</body>
</html>
