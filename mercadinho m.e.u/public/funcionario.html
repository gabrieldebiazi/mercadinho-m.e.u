<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionário</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="barraNavegacao">
        <h1>Mercadinho</h1>

        <div class="botoes">
            <a class="link" href="index.html">Home</a>
            <a class="link" href="catalogo.html">Catálogo</a>
            <a class="link ativo" href="funcionario.html">Pedidos</a>
            <a class="btnSair" href="#">Sair</a>
        </div>
    </header>

    <main>
        <section class="tituloPagina">Painel do Funcionário</section>

        <p class="mensagem" id="pedidosMsg" role="alert" hidden></p>

        <section class="filtrosPedidos" id="filtrosPedidos" hidden>
            <button type="button" class="ativo" data-status="todos">Todos</button>
            <button type="button" data-status="pendente">Pendentes</button>
            <button type="button" data-status="em_separacao">Em Separação</button>
            <button type="button" data-status="pronto">Prontos</button>
            <button type="button" data-status="concluido">Concluídos</button>
            <button type="button" data-status="cancelado">Cancelados</button>
        </section>

        <section class="listaPedidos" id="listaPedidos" hidden></section>
    </main>

    <footer class="rodape">
        <p>Todos os direitos reservados &copy; 2026 mercadinho LTDA.</p>

        <div class="redesSociais">
            <p>Nos siga em nossas redes sociais</p>
            <div>
                <img src="imagens/instagram.png" alt="Instagram">
                <img src="imagens/linkedin.png" alt="LinkedIn">
                <img src="imagens/facebook.png" alt="Facebook">
            </div>
        </div>
    </footer>

    <script src="scripts/api.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/funcionario.js"></script>
</body>

</html>
