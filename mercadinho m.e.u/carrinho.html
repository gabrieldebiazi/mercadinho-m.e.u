<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="barraNavegacao">

        <h1>Mercadinho</h1>

        <div class="botoes">
            <a class="link" href="index.html">Home</a>
            <a class="link" href="catalogo.html">Catálogo</a>
            <a class="link" href="sobre.html">Sobre</a>
            <a class="link" href="carrinho.html">Carrinho</a>
            <a class="btnEntrar" href="login.html">Entrar</a>

    </header>

    <main>
        <div id="carrinho">

            <section id="listaItens">
                Essa vai ser a lista dos itens
            </section>


            <section id="valoresCarrinho">

                <div class="subtitulo">
                    <h2>Resumo da compra</h2>
                </div>

                <div class="valores">
                    <div>
                        <p>Subtotal</p>
                        <p id="subtotal"></p>
                    </div>

                    <div>
                        <p>Descontos</p>
                        <p id="descontos"></p>
                    </div>

                    <div>
                        <h2>Total</h2>
                        <h2 id="total"></h2>
                    </div>

                    <a class="btnContinuar" href="#">Continuar</a>
                </div>


            </section>
        </div>

    </main>

    <footer class="rodape">
        <p>Todos os direitos reservados &copy; 2026 mercadinho LTDA.</p>

        <div class="redesSociais">
            <p>Nos siga em nossas redes sociais:</p>
            <div>
                <img src="imagens/instagram.png" alt="Instagram">
                <img src="imagens/linkedin.png" alt="LinkedIn">
                <img src="imagens/facebook.png" alt="Facebook">

        </div>
