<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="barraNavegacao">

        <h1>Mercadinho</h1>

        <div class="botoes">
            <a class="link" href="index.html">Home<a></li>
            <a class="link" href="catalogo.html">Catálogo<a></li>
            <a class="link" href="sobre.html">Sobre<a></li>
            <a class="link" href="carrinho.html">Carrinho<a></li>
            <a class="btnEntrar" href="login.html">Entrar</a></li>
        </div>
    </header>

    <main>
        <section class="tituloPagina">
            <h1>Login</h1>
        </section>

        <section id="login">
            <form id="formLogin">
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

                <button type="submit">Entrar</button>

                <h2>Não possui uma conta? <a href="cadastro.html">Cadastre-se</a></h2>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <p>Todos os direitos reservados &copy; 2026 mercadinho LTDA.</p>

        <div class="redesSociais">
            <ul>
                <li><img src="" alt="Instagram"></li>
                <li><img src="" alt="LinkedIn"></li>
                <li><img src="" alt="Facebook"></li>
            </ul>
        </div>
    </footer>

    <script src="scripts/login.js"></script>
</body>
</html>
